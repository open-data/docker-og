[program:aia]
chown=vuejs:vuejs
user=vuejs
; environment=TMPDIR="/srv/app/backup"
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=15
stopsignal=QUIT
numprocs=1
process_name=%(program_name)s-%(process_num)02d
command=/bin/bash -c "if [[ -d '/srv/app/aia/src/node_modules' && -d '/home/vuejs/.nvm' ]]; then \
          . /home/vuejs/.bashrc; \
          nvm use 16; \
          NODE_ENV='production'; \
          npm --prefix /srv/app/aia/src run serve -- \
            --host 0.0.0.0 \
            --port 8001 \
            --disableHostCheck true; \
        fi;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=998