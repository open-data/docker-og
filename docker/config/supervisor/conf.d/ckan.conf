[program:ckan-registry]
chown=ckan:ckan
user=ckan
; environment=TMPDIR="/srv/app/backup"
environment=NODE_PATH="/home/ckan/.nvm/versions/node/16/lib/node_modules:/srv/app/ckan/src/ckanext-canada/node_modules"
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=15
stopsignal=QUIT
numprocs=1
process_name=%(program_name)s-%(process_num)02d
command=/bin/bash -c "if [[ -f '/srv/app/ckan/bin/uwsgi' && -d '/srv/app/ckan/src/ckanext-canada/node_modules' && -d '/home/ckan/.nvm' ]]; then \
        . /home/ckan/.bashrc; \
        nvm use 16; \
        NODE_ENV='production'; \
        NODE_PATH='/home/ckan/.nvm/versions/node/16/lib/node_modules:/srv/app/ckan/src/ckanext-canada/node_modules'; \
        /srv/app/ckan/bin/uwsgi \
            --master \
            --workers 1 \
            --threads 1 \
            --log-master \
            --http-socket :5001 \
            --single-interpreter \
            --uid ckan \
            --gid ckan \
            --chdir /srv/app/ckan \
            --wsgi-file /srv/app/ckan/registry-wsgi.py \
            --lazy-apps \
            --touch-workers-reload /srv/app/ckan/reload.trigger \
            --worker-reload-mercy 1 \
            --stats :1717; \
        fi;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=998

[program:ckan-jobs]
chown=ckan:ckan
user=ckan
; environment=TMPDIR="/srv/app/backup"
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=15
stopsignal=QUIT
numprocs=1
process_name=%(program_name)s-%(process_num)02d
command=/bin/bash -c "if [[ -f '/srv/app/ckan/bin/ckan' ]]; then \
        /srv/app/ckan/bin/python \
        /srv/app/ckan/bin/ckan \
            -c /srv/app/ckan/registry.ini \
            jobs \
            worker;
        fi;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=998

[group:registry-stack]
programs=ckan-registry,ckan-jobs
priority=999
